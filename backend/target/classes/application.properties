# ===================================================
# ELECTROMART SPRING BOOT CONFIGURATION
# ===================================================

# Server
server.port=8080

# ===================================================
# MySQL Database Connection
# ===================================================
spring.datasource.url=jdbc:mysql://localhost:3306/electromart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================
# JPA / Hibernate Settings
# ===================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================
# OTP Settings
# ===================================================
# OTP validity in minutes
app.otp.expiry-minutes=5

# ===================================================
# Logging
# ===================================================
logging.level.com.electromart=DEBUG
